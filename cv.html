<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon CV</title>

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">

    <style>
        body {
            margin: 0;
            background-color: #1a1a2e;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 2rem;
            text-align: center;
            color: #00fff0;
            font-size: 1.8rem;
            font-weight: bold;
        }

        .pdf-container {
            width: 100%;
            height: 90vh;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .back-btn {
            display: block;
            text-align: center;
            margin: 1rem auto;
            padding: 0.7rem 1.4rem;
            background-color: #00fff0;
            color: #1a1a2e;
            width: fit-content;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .back-btn:hover {
            background-color: #ffffff;
        }
    </style>
</head>

<body>

<header>
    Mon CV – Rayane Ababsa
</header>

<div class="pdf-container">
    <!-- Ton fichier PDF doit s'appeler cv.pdf -->
    <iframe src="cv.pdf"></iframe>
</div>

<a href="index.html" class="back-btn">← Retour au Portfolio</a>

</body>
</html>
